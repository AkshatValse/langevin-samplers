name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Scientific regression tests
        run: uv run python -m unittest discover -s tests -v
      - name: Small end-to-end pipeline
        run: |
          uv run python scripts/01_gaussian_bias.py --smoke
          uv run python scripts/02_multimodal.py --smoke
          uv run python scripts/03_plot.py
