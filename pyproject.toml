[project]
name = "langevin-samplers"
version = "0.1.0"
description = "Discretization bias of unadjusted and Metropolis-adjusted Langevin algorithms, measured against exact references"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langevin"]
